# Keeps the GST Assistant in step with main (23 Nov 2026), with nobody asked:
# on every push to main it loads the firm's docs and the table columns into the
# private table assistant_knowledge, and deploys the Edge Function gst-assistant
# when its code changed. The screens need nothing here: every Vercel build
# regenerates them (npm run build), and the panel reads the live page.
#
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and
# variables → Actions). Without it the job says so and stops, green.
# The project is named here by hand, never from SUPABASE_PROJECT_REF (CLAUDE.md).
name: GST Assistant knowledge

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: assistant-knowledge
  cancel-in-progress: true

jobs:
  load:
    runs-on: ubuntu-latest
    env:
      PROJECT: gcquafqxbykxkbexcdpy
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Secret present?
        id: secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set: the assistant's docs were not refreshed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.secret.outputs.ok == 'true'
        with:
          node-version: 20
      - name: Load the docs into assistant_knowledge
        if: steps.secret.outputs.ok == 'true'
        run: |
          node scripts/build-assistant-knowledge.mjs --sql "$RUNNER_TEMP/knowledge.sql"
          jq -Rs '{query: .}' "$RUNNER_TEMP/knowledge.sql" > "$RUNNER_TEMP/body.json"
          curl -fsS -X POST "https://api.supabase.com/v1/projects/$PROJECT/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/body.json"
      - name: Did the assistant's function change?
        if: steps.secret.outputs.ok == 'true'
        id: fn
        run: |
          # A run started by hand always deploys (to recover a failed deploy).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git diff --name-only HEAD~1 HEAD | grep -qE '^(supabase/functions/(gst-assistant|_shared)/|\.github/workflows/assistant-knowledge\.yml)'; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - uses: supabase/setup-cli@v1
        if: steps.secret.outputs.ok == 'true' && steps.fn.outputs.changed == 'true'
        with:
          version: latest
      - name: Deploy gst-assistant
        if: steps.secret.outputs.ok == 'true' && steps.fn.outputs.changed == 'true'
        run: supabase functions deploy gst-assistant --project-ref "$PROJECT" --yes
