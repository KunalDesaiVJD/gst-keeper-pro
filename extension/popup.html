<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px system-ui, sans-serif; width: 300px; padding: 14px; margin: 0; color: #222; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: block; margin: 10px 0 3px; color: #555; }
    select, input { width: 100%; padding: 7px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; padding: 9px; box-sizing: border-box; background: #2563eb; color: #fff; border: 0; border-radius: 6px; margin-top: 14px; cursor: pointer; font-weight: 600; font-size: 13px; }
    button:disabled { background: #9db8f0; cursor: default; }
    #stop { background: #ef4444; margin-top: 8px; }
    .hint { color: #888; font-size: 11px; margin-top: 10px; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>GST Keeper — Portal Sync</h1>
  <label>Client</label>
  <select id="client"><option>Loading…</option></select>
  <label>Return period (MM/YYYY)</label>
  <input id="period" placeholder="06/2026" />
  <button id="go">Start sync in this browser</button>
  <button id="stop">Stop / clear current sync</button>
  <div class="hint">
    Opens the GST portal in a new tab, logs in (you type the CAPTCHA once), and pulls
    filing status + ledger opening into GST Keeper. Keep that tab open until it shows
    “done”. Runs on your own connection, so the portal treats it as a normal user.
  </div>
  <script src="db.js"></script>
  <script src="popup.js"></script>
</body>
</html>
